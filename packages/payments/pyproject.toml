[project]
name = "payments"
version = "0.1.0"
description = "Leo payments — Stripe Checkout (escrow), Connect onboarding, milestone Transfers, variations, refunds, disputes, webhooks."
requires-python = ">=3.11"
dependencies = [
    "stripe>=7.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
