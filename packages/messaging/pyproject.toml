[project]
name = "messaging"
version = "0.1.0"
description = "Shared capability: messaging — channels + WhatsApp + email + media + verification + AgentFramework protocol"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]
