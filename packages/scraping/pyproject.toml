[project]
name = "scraping"
version = "0.1.0"
description = "Web scraping capability layer: HTML/CSS parsing, fetch (static + browser), per-site adapters."
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "tinycss2>=1.3",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "core",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
