# Fresh recipient developer project; core reconstruction, not the historical DB.
# Configuration reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "renovation-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:18260/app/"
additional_redirect_urls = ["http://127.0.0.1:18260/app/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[inbucket]
enabled = true
port = 54324

[studio]
enabled = false

[analytics]
enabled = false
