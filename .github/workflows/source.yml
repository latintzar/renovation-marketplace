name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: make install
      - run: make doctor build test
      - run: .venv/bin/python -m pip install playwright==1.58.0
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the real native app
        run: |
          make dev > /tmp/marketplace-native.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18260/app/healthz && break
            sleep 1
          done
          .venv/bin/python tests/browser_native.py
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: make schema-check
